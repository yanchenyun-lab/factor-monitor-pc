# Server Port
server.port=8080

# Spring Application Name (Nacos 服务注册名)
spring.application.name=smartir-service

# ===== Nacos Discovery Configuration =====
# 本地 Nacos 地址 (D:\nacos 默认端口 18848)
spring.cloud.nacos.discovery.server-addr=127.0.0.1:18848
spring.cloud.nacos.discovery.enabled=true
# 使用 Spring Profile 区分环境：
#   本地开发 (local profile): 禁用 Nacos，直连 Python 服务 → 启动时加 --spring.profiles.active=local
#   内网/生产 (默认): 启用 Nacos 服务发现

# Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/smartIR?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=I7K7N6wOLm_k
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ===== Python Quant Microservice Configuration =====
# 内网/生产：通过 OpenFeign + Nacos 服务发现调用，quant.service.url 留空
# 本地开发：使用 application-local.properties 覆盖为直连地址 http://127.0.0.1:8000
quant.service.name=smartir-quant
quant.service.url=

# ===== Feign / Ribbon 超时配置 =====
# 连接超时 10s，读超时 120s（回测计算量大）
feign.client.config.default.connectTimeout=10000
feign.client.config.default.readTimeout=120000
# Ribbon (Hoxton 时代负载均衡，配合 Nacos 服务发现)
ribbon.ConnectTimeout=10000
ribbon.ReadTimeout=120000

